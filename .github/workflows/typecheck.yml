name: Typecheck

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

# The typecheck environment (neovim stable, lua-language-server version,
# third-party libraries) is defined in the Makefile; CI reuses the same
# targets locally contributors run. This workflow only handles caching.
jobs:
  typecheck:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - name: Cache toolchain and dependencies
        uses: actions/cache@v6
        with:
          path: |
            _neovim
            luals
            deps
          key: ${{ runner.os }}-typecheck-${{ hashFiles('Makefile') }}
      # Dependencies are pinned in the Makefile and only move via a
      # deliberate `make upgrade-deps`, so CI results stay reproducible.
      - name: Install toolchain
        run: make setup
      - name: Typecheck
        run: make check
